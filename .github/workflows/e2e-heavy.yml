name: E2E heavy (pNiquitao lab)

on:
  schedule:
    # Fallback only. The lab dispatches this workflow at 03:00 UTC (23:00
    # America/Caracas) through the Actions API, because GitHub's scheduler is
    # best-effort and can start hours late. This cron runs at 01:30 local time
    # and the gate skips it when the lab already ran and marked that SHA.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run (a manual dispatch bypasses the gate unless gate=true)"
        type: choice
        default: nightly
        options:
          - nightly
          - functional
          - stress
          - all-surfaces
          - smoke
      ref:
        description: "pNiquitao git ref (branch, tag or SHA). nightly always tests main."
        type: string
        default: main
      force:
        description: "nightly only: skip the product-merge gate"
        type: boolean
        default: false
      gate:
        description: "External trigger: apply the SHA gate and write the tested marker"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    name: Check for a new pNiquitao main commit
    # Runs on the fallback cron and on dispatches from the lab, which pass
    # gate=true so the external trigger respects the same tested-SHA marker.
    if: github.event_name == 'schedule' || inputs.gate == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.latest.outputs.sha }}
    steps:
      - name: Latest pNiquitao main
        id: latest
        env:
          SSH_KEY: ${{ secrets.PNIQUITAO_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/pni_deploy"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          sha="$(GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            git ls-remote git@github.com:Ben-Gonzalez-97/pNiquitao.git refs/heads/main | cut -f1)"
          rm -f "$key"
          if [ -z "$sha" ]; then
            echo "::error::PNIQUITAO_DEPLOY_KEY cannot read Ben-Gonzalez-97/pNiquitao. Add the public key as a read-only deploy key on that repository."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "latest main: ${sha}"

      - name: Restore tested marker
        id: marker
        uses: actions/cache/restore@v6
        with:
          path: .tested-sha
          key: pni-tested-${{ steps.latest.outputs.sha }}
          lookup-only: true

      - name: Decide
        id: decide
        env:
          CACHE_HIT: ${{ steps.marker.outputs.cache-hit }}
          SHA: ${{ steps.latest.outputs.sha }}
        run: |
          # GitHub's scheduler is best-effort: this cron has arrived 7h40m and 7h22m
          # late, i.e. mid-morning in Caracas. The lab timer owns the 03:00 UTC slot, so a
          # delayed delivery must never start a full suite while people are using the lab.
          hour="$(date -u +%-H)"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$hour" -ge 6 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Late scheduled trigger at $(date -u +%FT%TZ); skipping, the next run retries."
          elif [ "$CACHE_HIT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Already tested: ${SHA}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "New commit: ${SHA}"
          fi

  e2e:
    # github.event.inputs (not the inputs context): the inputs context is unavailable on
    # schedule events, and the job name then renders as a raw ${{ ... }} expression.
    name: ${{ github.event.inputs.suite || 'nightly' }} · pNiquitao@${{ github.event.inputs.ref || 'main' }}
    needs: gate
    # Manual dispatch runs unless it asks for the gate; gated runs only run when the
    # gate says the current pNiquitao/main SHA has not been tested yet.
    if: always() && (needs.gate.outputs.run == 'true' || (github.event_name == 'workflow_dispatch' && inputs.gate != true))
    # Serialize the heavy job: a manual run never overlaps the nightly.
    concurrency:
      group: e2e-lab
      cancel-in-progress: false
    # GitHub-hosted runner. Public repositories get free standard runner minutes.
    runs-on: ubuntu-latest
    # The suite takes about 1:10 in practice; 6 hours is the GitHub-hosted hard cap.
    timeout-minutes: 360
    env:
      CI: "true"
      NIQUITAO_GIT: ${{ github.workspace }}/pNiquitao
      LAB_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_USER_GERENTE: ${{ secrets.E2E_USER_GERENTE }}
      E2E_PASSWORD_GERENTE: ${{ secrets.E2E_PASSWORD_GERENTE }}
      E2E_USER_OPERADOR: ${{ secrets.E2E_USER_OPERADOR }}
      E2E_PASSWORD_OPERADOR: ${{ secrets.E2E_PASSWORD_OPERADOR }}
      E2E_OBS_LOGS_URL: ${{ secrets.E2E_OBS_LOGS_URL }}
      E2E_OBS_USER: ${{ secrets.E2E_OBS_USER }}
      E2E_OBS_PASSWORD: ${{ secrets.E2E_OBS_PASSWORD }}
      E2E_GLITCHTIP_URL: ${{ secrets.E2E_GLITCHTIP_URL }}
      E2E_GLITCHTIP_EMAIL: ${{ secrets.E2E_GLITCHTIP_EMAIL }}
      E2E_GLITCHTIP_PASSWORD: ${{ secrets.E2E_GLITCHTIP_PASSWORD }}
      E2E_CREDENTIALS_FILE: ${{ secrets.E2E_CREDENTIALS_FILE }}
      E2E_FX_COMMISSION: "1"
    steps:
      - name: Check pNiquitao access
        env:
          SSH_KEY: ${{ secrets.PNIQUITAO_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/pni_deploy"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          sha="$(GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            git ls-remote git@github.com:Ben-Gonzalez-97/pNiquitao.git refs/heads/main | cut -f1)"
          rm -f "$key"
          if [ -z "$sha" ]; then
            echo "::error::PNIQUITAO_DEPLOY_KEY cannot read Ben-Gonzalez-97/pNiquitao. Add the public key as a read-only deploy key on that repository."
            exit 1
          fi
          echo "pNiquitao main: ${sha}"

      - name: Checkout pNiquitao (e2e tree)
        uses: actions/checkout@v7.0.1
        with:
          repository: Ben-Gonzalez-97/pNiquitao
          ref: ${{ inputs.ref || 'main' }}
          ssh-key: ${{ secrets.PNIQUITAO_DEPLOY_KEY }}
          path: pNiquitao
          # Only materialize e2e/. Full history is still fetched because nightly.sh
          # needs origin/main, product-path diffs and `git archive origin/main e2e`.
          sparse-checkout: e2e
          fetch-depth: 0

      - name: Environment info
        run: |
          uname -a
          node --version
          git --version
          rsync --version | head -1
          python3 --version
          df -h .

      - name: Check required secrets
        run: |
          missing=0
          for v in E2E_BASE_URL E2E_USER_GERENTE E2E_PASSWORD_GERENTE; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret: $v"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.3
          run_install: false

      - name: Resolve Node version from pNiquitao
        # pNiquitao/main pins the runtime in e2e/package.json (engines.node) and bumps it
        # without warning. Following it here turns an overnight install failure caused by
        # a stale pin (for example ^26 while this workflow used 22) into a non-issue.
        id: node_version
        working-directory: pNiquitao/e2e
        run: |
          spec="$(node -p "require('./package.json').engines?.node || ''" 2>/dev/null || true)"
          major="$(printf '%s' "$spec" | grep -oE '[0-9]+' | head -1 || true)"
          if [ -z "$major" ]; then
            echo "::warning::pNiquitao/e2e/package.json declares no engines.node; falling back to 22"
            major=22
          fi
          echo "version=${major}" >> "$GITHUB_OUTPUT"
          echo "pNiquitao requires node '${spec:-<none>}', using ${major}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: pnpm
          cache-dependency-path: pNiquitao/e2e/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: pNiquitao/e2e
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: pNiquitao/e2e
        run: |
          # apt mirrors on GitHub-hosted runners occasionally fail to resolve; that must
          # not fail a nightly that is otherwise fine, so retry the whole install.
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install failed (attempt ${attempt}/3); retrying in 15s"
            sleep 15
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      - name: Run suite
        id: suite
        working-directory: pNiquitao
        env:
          SUITE: ${{ inputs.suite || 'nightly' }}
          FORCE: ${{ inputs.force }}
          PN_REF: ${{ inputs.ref || 'main' }}
        run: |
          echo "suite=${SUITE} ref=${PN_REF}"
          code=0
          if [ "$SUITE" = "nightly" ] && [ "$PN_REF" != "main" ]; then
            echo "::error::suite=nightly always tests pNiquitao main; use functional, stress, all-surfaces or smoke for another ref"
            code=64
          else
            case "$SUITE" in
              nightly)
                if [ "$FORCE" = "true" ]; then
                  bash e2e/scripts/nightly.sh run --force || code=$?
                else
                  bash e2e/scripts/nightly.sh run || code=$?
                fi
                ;;
              functional)   pnpm --dir e2e run test:functional || code=$? ;;
              stress)       pnpm --dir e2e run test:stress || code=$? ;;
              all-surfaces) pnpm --dir e2e run test:all-surfaces || code=$? ;;
              smoke)        pnpm --dir e2e run test:smoke || code=$? ;;
              *)
                echo "::error::Unknown suite: ${SUITE}"
                code=64
                ;;
            esac
          fi
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          # nightly.sh: 0 approved/skipped, 1 failed, 2 FAILED-INFRA (lab not ready).
          exit "$code"

      - name: Remove checkout credentials
        if: always()
        run: |
          git -C pNiquitao config --unset-all http.https://github.com/.extraheader || true
          git -C pNiquitao config --unset-all core.sshCommand || true
          rm -rf pNiquitao/e2e/.auth

      - name: Prepare public summary
        if: always()
        env:
          LAB_ORIGIN: ${{ secrets.E2E_BASE_URL }}
          OBS_ORIGIN: ${{ secrets.E2E_OBS_LOGS_URL }}
          GLITCHTIP_ORIGIN: ${{ secrets.E2E_GLITCHTIP_URL }}
        run: |
          # No working-directory here: it would fail before the script runs when the
          # checkout itself failed (for example a missing or expired PAT).
          mkdir -p pNiquitao/public-summary
          report="$(ls -1dt pNiquitao/e2e/corridas/nightly-*.md 2>/dev/null | head -1 || true)"
          if [ -n "$report" ] && [ -f "$report" ]; then
            python3 - "$report" pNiquitao/public-summary/nightly.md <<'PY'
          import os
          import sys

          source, target = sys.argv[1], sys.argv[2]
          text = open(source, encoding="utf-8").read()
          for key, token in (
              ("LAB_ORIGIN", "<lab>"),
              ("OBS_ORIGIN", "<lab-obs>"),
              ("GLITCHTIP_ORIGIN", "<glitchtip>"),
          ):
              value = os.environ.get(key, "")
              if value:
                  text = text.replace(value, token)
          open(target, "w", encoding="utf-8").write(text)
          PY
            cat pNiquitao/public-summary/nightly.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No nightly summary was produced for this run." > pNiquitao/public-summary/nightly.md
          fi

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Never upload test-results/, traces, videos or nightly logs in the clear here:
          # this repository is public and Playwright traces can contain typed passwords.
          name: e2e-summary-${{ github.run_id }}
          path: pNiquitao/public-summary/
          if-no-files-found: ignore
          retention-days: 14

      - name: Encrypt raw artifacts
        # A debugging aid must never turn a green nightly red: failures here are visible
        # as a warning step but do not fail the job.
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          ARTIFACT_PUBKEY: ${{ secrets.E2E_ARTIFACTS_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          src="pNiquitao/e2e"
          if [ -z "${ARTIFACT_PUBKEY:-}" ]; then
            echo "::warning::E2E_ARTIFACTS_SSH_PUBLIC_KEY is not set; skipping the encrypted artifact"
            exit 0
          fi

          # nightly.sh writes artifacts/nightly-<date>/ (logs, metrics, test-results-*),
          # corridas/nightly-*.md and, for the lighter suites, Playwright's test-results/.
          paths=()
          for d in artifacts corridas test-results; do
            if [ -d "$src/$d" ]; then
              paths+=("$d")
            fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No raw artifacts to encrypt."
            exit 0
          fi

          printf '%s\n' "$ARTIFACT_PUBKEY" > "$RUNNER_TEMP/age-recipient.pub"
          if ! command -v age >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi

          mkdir -p encrypted-artifacts
          out="encrypted-artifacts/e2e-artifacts-${GITHUB_RUN_ID}.tar.gz.age"
          tar -czf - -C "$src" "${paths[@]}" \
            | age -R "$RUNNER_TEMP/age-recipient.pub" -o "$out"
          rm -f "$RUNNER_TEMP/age-recipient.pub"
          ls -lh encrypted-artifacts

      - name: Upload encrypted artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Offsite copy, encrypted to an SSH public key whose private half never leaves
          # the operator. The lab keeps the primary (plaintext) bundle.
          name: e2e-raw-${{ github.run_id }}
          path: encrypted-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload raw artifacts to the lab
        # The lab copy is the primary debugging surface: traces, videos, per-surface logs
        # and metrics travel over a key whose only power is the receive forced command.
        # A debugging aid must never turn a green nightly red.
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        env:
          ARTIFACTS_KEY: ${{ secrets.E2E_ARTIFACTS_SSH_KEY }}
          ARTIFACTS_TARGET: ${{ secrets.E2E_ARTIFACTS_TARGET }}
          ARTIFACTS_KNOWN_HOSTS: ${{ secrets.E2E_ARTIFACTS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          src="pNiquitao/e2e"
          if [ -z "${ARTIFACTS_KEY:-}" ] || [ -z "${ARTIFACTS_TARGET:-}" ]; then
            echo "::warning::E2E_ARTIFACTS_SSH_KEY or E2E_ARTIFACTS_TARGET is not set; skipping the lab copy"
            exit 0
          fi

          paths=()
          for d in artifacts corridas test-results; do
            if [ -d "$src/$d" ]; then
              paths+=("$d")
            fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No raw artifacts to upload."
            exit 0
          fi

          umask 077
          key="$RUNNER_TEMP/e2e-artifacts-key"
          printf '%s\n' "$ARTIFACTS_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          printf '%s\n' "${ARTIFACTS_KNOWN_HOSTS:-}" | tr -d '\r' > "$RUNNER_TEMP/e2e-known-hosts"
          tar -czf - -C "$src" "${paths[@]}" \
            | ssh -i "$key" \
                -o IdentitiesOnly=yes \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$RUNNER_TEMP/e2e-known-hosts" \
                "$ARTIFACTS_TARGET" "receive ${GITHUB_RUN_ID}"
          rm -f "$key" "$RUNNER_TEMP/e2e-known-hosts"

      - name: Mark pNiquitao SHA as processed
        # Only a suite that actually ran may mark the SHA. An empty exit means the step was
        # skipped (checkout, install or setup failed), and exit=2 means FAILED-INFRA (lab
        # not ready or deploy behind main): both must leave the SHA unmarked so the next
        # nightly retries it instead of silently skipping a build nobody tested.
        if: always() && (github.event_name == 'schedule' || inputs.gate == true) && (inputs.ref || 'main') == 'main' && (inputs.suite || 'nightly') == 'nightly' && needs.gate.outputs.sha != '' && (steps.suite.outputs.exit == '0' || steps.suite.outputs.exit == '1')
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: printf '%s\n' "$SHA" > .tested-sha

      - name: Save processed marker
        if: always() && (github.event_name == 'schedule' || inputs.gate == true) && (inputs.ref || 'main') == 'main' && (inputs.suite || 'nightly') == 'nightly' && needs.gate.outputs.sha != '' && (steps.suite.outputs.exit == '0' || steps.suite.outputs.exit == '1')
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .tested-sha
          key: pni-tested-${{ needs.gate.outputs.sha }}
