name: E2E heavy (pNiquitao lab)

on:
  schedule:
    # Poll every 15 minutes. The `gate` job runs the heavy suite only when
    # pNiquitao/main has a commit that has not been tested yet.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run (manual dispatch always bypasses the gate)"
        type: choice
        default: nightly
        options:
          - nightly
          - functional
          - stress
          - all-surfaces
          - smoke
      ref:
        description: "pNiquitao git ref (branch, tag or SHA). nightly always tests main."
        type: string
        default: main
      force:
        description: "nightly only: skip the product-merge gate"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    name: Check for a new pNiquitao main commit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.latest.outputs.sha }}
    steps:
      - name: Latest pNiquitao main
        id: latest
        env:
          GH_TOKEN: ${{ secrets.PNIQUITAO_TOKEN }}
        run: |
          sha="$(gh api repos/Ben-Gonzalez-97/pNiquitao/commits/main --jq .sha)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "latest main: ${sha}"

      - name: Restore tested marker
        id: marker
        uses: actions/cache/restore@v6
        with:
          path: .tested-sha
          key: pni-tested-${{ steps.latest.outputs.sha }}
          lookup-only: true

      - name: Decide
        id: decide
        env:
          CACHE_HIT: ${{ steps.marker.outputs.cache-hit }}
          SHA: ${{ steps.latest.outputs.sha }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Already tested: ${SHA}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "New commit: ${SHA}"
          fi

  e2e:
    name: ${{ inputs.suite || 'nightly' }} · pNiquitao@${{ inputs.ref || 'main' }}
    needs: gate
    # Manual dispatch always runs; scheduled runs only run when the gate says the
    # current pNiquitao/main SHA has not been tested yet.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true')
    # Serialize the heavy job only, so 15-minute gate polls are never blocked behind a run.
    concurrency:
      group: e2e-lab
      cancel-in-progress: false
    # GitHub-hosted runner. Public repositories get free standard runner minutes.
    runs-on: ubuntu-latest
    # The suite takes about 1:10 in practice; 6 hours is the GitHub-hosted hard cap.
    timeout-minutes: 360
    env:
      CI: "true"
      NIQUITAO_GIT: ${{ github.workspace }}/pNiquitao
      LAB_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_USER_GERENTE: ${{ secrets.E2E_USER_GERENTE }}
      E2E_PASSWORD_GERENTE: ${{ secrets.E2E_PASSWORD_GERENTE }}
      E2E_USER_OPERADOR: ${{ secrets.E2E_USER_OPERADOR }}
      E2E_PASSWORD_OPERADOR: ${{ secrets.E2E_PASSWORD_OPERADOR }}
      E2E_OBS_LOGS_URL: ${{ secrets.E2E_OBS_LOGS_URL }}
      E2E_OBS_USER: ${{ secrets.E2E_OBS_USER }}
      E2E_OBS_PASSWORD: ${{ secrets.E2E_OBS_PASSWORD }}
      E2E_GLITCHTIP_URL: ${{ secrets.E2E_GLITCHTIP_URL }}
      E2E_GLITCHTIP_EMAIL: ${{ secrets.E2E_GLITCHTIP_EMAIL }}
      E2E_GLITCHTIP_PASSWORD: ${{ secrets.E2E_GLITCHTIP_PASSWORD }}
      E2E_CREDENTIALS_FILE: ${{ secrets.E2E_CREDENTIALS_FILE }}
      E2E_FX_COMMISSION: "1"
    steps:
      - name: Checkout pNiquitao (e2e tree)
        uses: actions/checkout@v7.0.1
        with:
          repository: Ben-Gonzalez-97/pNiquitao
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.PNIQUITAO_TOKEN }}
          path: pNiquitao
          # Only materialize e2e/. Full history is still fetched because nightly.sh
          # needs origin/main, product-path diffs and `git archive origin/main e2e`.
          sparse-checkout: e2e
          fetch-depth: 0

      - name: Environment info
        run: |
          uname -a
          node --version
          git --version
          rsync --version | head -1
          python3 --version
          df -h .

      - name: Check required secrets
        run: |
          missing=0
          for v in E2E_BASE_URL E2E_USER_GERENTE E2E_PASSWORD_GERENTE; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret: $v"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pNiquitao/e2e/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: pNiquitao/e2e
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: pNiquitao/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run suite
        id: suite
        working-directory: pNiquitao
        env:
          SUITE: ${{ inputs.suite || 'nightly' }}
          FORCE: ${{ inputs.force }}
          PN_REF: ${{ inputs.ref || 'main' }}
        run: |
          echo "suite=${SUITE} ref=${PN_REF}"
          code=0
          if [ "$SUITE" = "nightly" ] && [ "$PN_REF" != "main" ]; then
            echo "::error::suite=nightly always tests pNiquitao main; use functional, stress, all-surfaces or smoke for another ref"
            code=64
          else
            case "$SUITE" in
              nightly)
                if [ "$FORCE" = "true" ]; then
                  bash e2e/scripts/nightly.sh run --force || code=$?
                else
                  bash e2e/scripts/nightly.sh run || code=$?
                fi
                ;;
              functional)   pnpm --dir e2e run test:functional || code=$? ;;
              stress)       pnpm --dir e2e run test:stress || code=$? ;;
              all-surfaces) pnpm --dir e2e run test:all-surfaces || code=$? ;;
              smoke)        pnpm --dir e2e run test:smoke || code=$? ;;
              *)
                echo "::error::Unknown suite: ${SUITE}"
                code=64
                ;;
            esac
          fi
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          # nightly.sh: 0 approved/skipped, 1 failed, 2 FAILED-INFRA (lab not ready).
          exit "$code"

      - name: Remove checkout credentials
        if: always()
        run: |
          git -C pNiquitao config --unset-all http.https://github.com/.extraheader || true
          rm -rf pNiquitao/e2e/.auth

      - name: Prepare public summary
        if: always()
        env:
          LAB_ORIGIN: ${{ secrets.E2E_BASE_URL }}
          OBS_ORIGIN: ${{ secrets.E2E_OBS_LOGS_URL }}
          GLITCHTIP_ORIGIN: ${{ secrets.E2E_GLITCHTIP_URL }}
        run: |
          # No working-directory here: it would fail before the script runs when the
          # checkout itself failed (for example a missing or expired PAT).
          mkdir -p pNiquitao/public-summary
          report="$(ls -1dt pNiquitao/e2e/corridas/nightly-*.md 2>/dev/null | head -1 || true)"
          if [ -n "$report" ] && [ -f "$report" ]; then
            python3 - "$report" pNiquitao/public-summary/nightly.md <<'PY'
          import os
          import sys

          source, target = sys.argv[1], sys.argv[2]
          text = open(source, encoding="utf-8").read()
          for key, token in (
              ("LAB_ORIGIN", "<lab>"),
              ("OBS_ORIGIN", "<lab-obs>"),
              ("GLITCHTIP_ORIGIN", "<glitchtip>"),
          ):
              value = os.environ.get(key, "")
              if value:
                  text = text.replace(value, token)
          open(target, "w", encoding="utf-8").write(text)
          PY
            cat pNiquitao/public-summary/nightly.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No nightly summary was produced for this run." > pNiquitao/public-summary/nightly.md
          fi

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Never upload test-results/, traces, videos or nightly logs here: this
          # repository is public and Playwright traces can contain typed passwords.
          name: e2e-summary-${{ github.run_id }}
          path: pNiquitao/public-summary/
          if-no-files-found: ignore
          retention-days: 14

      - name: Mark pNiquitao SHA as processed
        # exit=2 means FAILED-INFRA (lab not ready or deploy behind main): leave the SHA
        # unmarked so the next poll retries once the deploy catches up.
        if: always() && github.event_name == 'schedule' && needs.gate.outputs.sha != '' && steps.suite.outputs.exit != '2'
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: printf '%s\n' "$SHA" > .tested-sha

      - name: Save processed marker
        if: always() && github.event_name == 'schedule' && needs.gate.outputs.sha != '' && steps.suite.outputs.exit != '2'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .tested-sha
          key: pni-tested-${{ needs.gate.outputs.sha }}
